services:

  # ─────────────────────────────────────────────────────────
  # PostgreSQL database
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     mohamed
      POSTGRES_PASSWORD: MySecrets
      POSTGRES_DB:       auto_parts_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"          # expose only for dev inspection; remove in prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mohamed -d auto_parts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────
  # Flask backend
  # ─────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app        # live-reload in dev; remove in prod
    environment:
      FLASK_APP:       app
      FLASK_ENV:       development
      SECRET_KEY:      dev-secret-change-in-prod
      JWT_SECRET_KEY:  jwt-dev-secret-change-in-prod
      DATABASE_URL:    postgresql://mohamed:MySecrets@db:5432/auto_parts_db
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres to be ready

  # ─────────────────────────────────────────────────────────
  # React / Vite frontend
  # ─────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app       # live-reload in dev
      - /app/node_modules     # keep container's node_modules intact
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data: